services:
  postgres:
    image: postgres:16-alpine
    container_name: medflow-postgres
    environment:
      POSTGRES_DB: medflow
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow
    ports:
      - "5432:5432"
    volumes:
      - medflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflow -d medflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medflow_postgres_data:
